name: Deploy password-protected site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Verify Jekyll output
        run: test -f _site/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Encrypt HTML pages
        run: |
          set -euxo pipefail
          test -f node_modules/staticrypt/cli/index.js
          shopt -s nullglob
          site_entries=(_site/*)
          node node_modules/staticrypt/cli/index.js "${site_entries[@]}" -r -d _site \
            -p unicorn \
            --short \
            --template-title "Per Pierre Jorgensen" \
            --template-instructions "Enter the portfolio password to view this page." \
            --template-placeholder "Password" \
            --template-button "Continue" \
            --template-color-primary "#e3660e" \
            --template-color-secondary "#f9f9f9" \
            --template-error "Incorrect password." \
            --remember 30
          grep -q staticrypt-html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
