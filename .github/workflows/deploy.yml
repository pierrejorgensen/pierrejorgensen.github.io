name: Deploy password-protected site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATICRYPT_PASSWORD: unicorn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Verify Jekyll output
        run: |
          test -f _site/index.html
          find _site -name '*.html' | wc -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Verify StatiCrypt install
        run: test -f node_modules/staticrypt/cli/index.js

      - name: Verify StatiCrypt config
        run: test -f .staticrypt.json

      - name: Verify portfolio password is set
        run: test -n "$STATICRYPT_PASSWORD"

      - name: Encrypt HTML pages
        run: npm run encrypt

      - name: Verify encrypted homepage
        run: grep -q staticrypt-html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
